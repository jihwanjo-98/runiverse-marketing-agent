[project]
name = "runiverse-contracts"
version = "0.0.1"
description = "API와 워커가 공유하는 데이터 계약(pydantic 모델)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runiverse_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
