# uv 워크스페이스 루트 (가상 루트: 자체 패키지 없음)
# 하나의 .venv와 uv.lock으로 아래 파이썬 패키지들을 함께 관리한다.
[tool.uv.workspace]
members = [
  "packages/contracts",
  "apps/api",
  "worker",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["runiverse_contracts", "runiverse_api", "hub_worker"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
