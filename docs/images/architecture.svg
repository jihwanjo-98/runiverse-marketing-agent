  <rect width="1400" height="1120" fill="#FFFFFF"/>

  <text x="60" y="52" font-size="26" font-weight="700" fill="#0F172A">Runiverse Marketing Agent · 시스템 아키텍처</text>
  <text x="60" y="80" font-size="15" fill="#64748B">데이터 출입은 FastAPI 한 곳 · 작업 안은 LangGraph, 작업 사이는 DB · 숫자는 코드, 판단은 LLM</text>

